services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evidencevault
      POSTGRES_USER: evidencevault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional: only needed if CLAMAV_ENABLED=true. Provides malware scanning on evidence upload.
  # First startup downloads virus definitions (~500MB) - watch `docker compose logs -f clamav`
  # and wait for "Listening on TCP" before it's ready.
  clamav:
    image: clamav/clamav:1.3
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: only needed if RATE_LIMIT_BACKEND=redis. Gives a distributed rate-limit counter
  # shared across every app instance instead of the default per-instance in-memory one.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/evidencevault
      DATABASE_USERNAME: evidencevault
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      DATABASE_DRIVER: org.postgresql.Driver
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      EVIDENCE_MASTER_KEY_BASE64: ${EVIDENCE_MASTER_KEY_BASE64}
      EVIDENCE_PREVIOUS_MASTER_KEYS_BASE64: ${EVIDENCE_PREVIOUS_MASTER_KEYS_BASE64:-}
      EVIDENCE_STORAGE_DIR: /app/data/evidence-blobs
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      EVIDENCE_USER_QUOTA_BYTES: ${EVIDENCE_USER_QUOTA_BYTES:-5368709120}
      # Set CLAMAV_ENABLED=true only once the clamav service above is confirmed healthy.
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # Set RATE_LIMIT_BACKEND=redis only once the redis service above is confirmed running.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - evidence_data:/app/data

volumes:
  pgdata:
  evidence_data:
  clamav_data:
  redis_data:
